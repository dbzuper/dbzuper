services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: dbzuper_test
        ports: ['3307:3306']
        tmpfs: ['/var/lib/mysql']
    mariadb:
        image: mariadb:11.4
        environment:
            MARIADB_ROOT_PASSWORD: secret
            MARIADB_DATABASE: dbzuper_test
        ports: ['3308:3306']
        tmpfs: ['/var/lib/mysql']
