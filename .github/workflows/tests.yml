name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: dbsuperb_test }
        ports: ["3307:3306"]
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: secret, MARIADB_DATABASE: dbsuperb_test }
        ports: ["3308:3306"]
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_PASSWORD: secret }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    env:
      TEST_PGSQL_PASSWORD: secret
      DBSUPERB_REQUIRE_ENGINES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, pdo_pgsql, pdo_sqlite', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run build
      - run: php artisan test
      - run: npm run test
      - run: npx playwright install --with-deps chromium && npm run e2e
