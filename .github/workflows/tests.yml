name: tests
on: [push, pull_request]
permissions:
  contents: read
# Three jobs run side by side (one after another they took about 10 minutes). Each one builds the
# frontend: the Vite build generates the Wayfinder route files that tsc, Vitest and the PHP page
# tests need.
jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: dbzuper_test }
        ports: ["3307:3306"]
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: secret, MARIADB_DATABASE: dbzuper_test }
        ports: ["3308:3306"]
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_PASSWORD: secret }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    env:
      TEST_PGSQL_PASSWORD: secret
      DBZUPER_REQUIRE_ENGINES: 1
      # The native backup/restore tests fail instead of skipping when a dump or restore tool is missing.
      DBZUPER_REQUIRE_NATIVE_TOOLS: 1
      CI_MYSQL_CLIENT_VERSION: 8.4.9
    steps:
      - uses: actions/checkout@v7
      # Native backup/restore tools. pg_dump/psql 18 come from the PGDG repository (Ubuntu's are older than
      # the server). mariadb-dump/mariadb come from Ubuntu. MySQL's mysql-client package conflicts with
      # mariadb-client, so the MySQL 8.4 mysqldump/mysql come from Oracle's minimal tarball (an archived,
      # permanent URL) and are pointed at with DBZUPER_MYSQLDUMP_PATH / DBZUPER_MYSQL_PATH.
      - name: Install native database tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-client-18 mariadb-client
          curl -fsSL -o /tmp/mysql.tar.xz "https://cdn.mysql.com/archives/mysql-8.4/mysql-${CI_MYSQL_CLIENT_VERSION}-linux-glibc2.17-x86_64-minimal.tar.xz"
          sudo mkdir -p /opt/mysql
          sudo tar -xJf /tmp/mysql.tar.xz -C /opt/mysql --strip-components=1
          {
            echo "DBZUPER_PG_DUMP_PATH=/usr/lib/postgresql/18/bin/pg_dump"
            echo "DBZUPER_PSQL_PATH=/usr/lib/postgresql/18/bin/psql"
            echo "DBZUPER_MARIADB_DUMP_PATH=$(command -v mariadb-dump)"
            echo "DBZUPER_MARIADB_PATH=$(command -v mariadb)"
            echo "DBZUPER_MYSQLDUMP_PATH=/opt/mysql/bin/mysqldump"
            echo "DBZUPER_MYSQL_PATH=/opt/mysql/bin/mysql"
          } >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --version
          mariadb-dump --version
          /opt/mysql/bin/mysqldump --version
          /opt/mysql/bin/mysql --version
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, pdo_pgsql, pdo_sqlite, bcmath', coverage: none }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run build
      - run: composer types:check -- --memory-limit=1G
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_sqlite, bcmath', coverage: none }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run build
      - run: npm run types:check
      - run: npm run check
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    services:
      # Only server-connections.spec.ts needs an engine server; it skips when MySQL is down.
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: dbzuper_test }
        ports: ["3307:3306"]
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, pdo_pgsql, pdo_sqlite, bcmath', coverage: none }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run e2e
        env:
          # The local budgets (2000 and 50 ms) hold on a developer machine. The runner draws the WebGL
          # universe in software on 2 shared cores, and has measured 2.0-3.5 s and up to 51 ms there;
          # these catch a regression without failing on the hardware.
          E2E_UNIVERSE_BUDGET_MS: 5000
          E2E_SIDEBAR_LONG_TASK_BUDGET_MS: 100
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            storage/logs/
          retention-days: 7
