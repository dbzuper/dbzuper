name: release
# Pushing a version tag (v1.2.3) publishes the Docker image to ghcr.io/<owner>/<repo>:
# 1.2.3, 1.2 and latest (pre-releases such as v1.3.0-rc1 get only their own tag).
# A branch push that changes what the image is built from runs the same build without logging in or
# pushing, so a broken Dockerfile or action upgrade shows up before the next release tag.
on:
  push:
    tags: ['v*']
    branches: ['**']
    # Not evaluated for tag pushes, which always build.
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .npmrc
      - pnpm-workspace.yaml
      - .github/workflows/release.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
