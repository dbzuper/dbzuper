; DBZuper: Laravel's ValidatePostSize middleware answers 413 to any request body (PUT included) larger than
; post_max_size. Restore pieces are at most 8 MiB (the client sends 4 MiB), exactly PHP's default 8M: allow headroom.
; upload_max_filesize is not raised: pieces are raw request bodies, not form file uploads.
post_max_size = 16M
