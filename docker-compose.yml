# Self-hosting: `docker compose up -d --build`, then see docs/self-hosting.md.
services:
    app:
        build: .
        image: dbzuper:local
        ports:
            - '8080:8080'
        # Lets connections reach a database on the computer running Docker as host.docker.internal
        # (Docker Desktop provides the name already; Linux needs this mapping).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - path: .env.docker
              required: false
        volumes:
            - dbzuper-storage:/app/storage
            - dbzuper-sqlite:/data/sqlite
        restart: unless-stopped

volumes:
    dbzuper-storage:
    dbzuper-sqlite:
