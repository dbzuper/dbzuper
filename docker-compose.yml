# Self-hosting: `docker compose up -d --build`, then see docs/self-hosting.md.
services:
    app:
        build: .
        image: dbzuper:local
        ports:
            - '8080:8080'
        env_file:
            - path: .env.docker
              required: false
        volumes:
            - dbzuper-storage:/app/storage
            - dbzuper-sqlite:/data/sqlite
        restart: unless-stopped

volumes:
    dbzuper-storage:
    dbzuper-sqlite:
