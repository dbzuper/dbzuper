# Self-hosting: `docker compose up -d --build`, then see docs/self-hosting.md.
services:
    app:
        build: .
        image: dbsuperb:local
        ports:
            - '8080:8080'
        env_file:
            - path: .env.docker
              required: false
        environment:
            APP_URL: ${APP_URL:-http://localhost:8080}
        volumes:
            - dbsuperb-storage:/app/storage
            - dbsuperb-sqlite:/data/sqlite
        restart: unless-stopped

volumes:
    dbsuperb-storage:
    dbsuperb-sqlite:
