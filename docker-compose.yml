# Self-hosting: `docker compose up -d --build`, then see docs/self-hosting.md.
services:
    app:
        build: .
        image: dbzuper:local
        # A fixed host name: on start the entrypoint fails backups/restores this host left running, and a recreated
        # container (an upgrade, a changed .env.docker) must count as the same host.
        hostname: dbzuper
        # The host port: DBZUPER_PORT=3000 docker compose up -d (or set it in a .env next to this file).
        ports:
            - '${DBZUPER_PORT:-8080}:8080'
        environment:
            DBZUPER_PORT: ${DBZUPER_PORT:-8080}
        # Lets connections reach a database on the computer running Docker as host.docker.internal
        # (Docker Desktop provides the name already; Linux needs this mapping).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - path: .env.docker
              required: false
        volumes:
            - dbzuper-storage:/app/storage
            - dbzuper-sqlite:/data/sqlite
        restart: unless-stopped

volumes:
    dbzuper-storage:
    dbzuper-sqlite:
